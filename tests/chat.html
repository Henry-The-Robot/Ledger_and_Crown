<!doctype html><html><head><meta charset="utf-8"><title>Conversations</title></head><body><pre id="out">running</pre>
<!-- A topic you have asked goes away (no "(again)"), a buyer says when she isn't buying, and a standing deal from her is on the menu. Run: chrome --headless --allow-file-access-from-files --virtual-time-budget=60000 --dump-dom tests/chat.html -->
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms)), out = [];
(async () => { try {
  const f = document.createElement("iframe"); f.style.cssText = "width:1194px;height:834px"; f.src = "../game.html?sandbox&new=1&touch=0"; document.body.appendChild(f); await new Promise(r => f.onload = r); await sleep(500);
  const w = f.contentWindow, d = w.document, G = w.G, s = G.s, S = w.Spring; G.closeDlg(); G.hidePanel();
  const btns = () => [...d.querySelectorAll("#dlg .ch button")].map(b => b.textContent.replace(/^\d+/, "")), txt = () => d.getElementById("dlg").textContent, click = re => [...d.querySelectorAll("#dlg .ch button")].find(b => re.test(b.textContent)).click();
  while (s.day < 9) S.sleep(s); s.offers.length = 0; s.trust.ashby = 8; s.flags = { ashbyAsked: true }; G.hud();
  G.talk("ashby"); await sleep(80);
  out.push(`she says plainly when she isn't buying (or lists the deal when she is): ${/isn't buying today/.test(txt()) || btns().some(b => /^Deal:/.test(b))}; the menu: ${btns().join(" | ")}`);
  const first = btns()[0]; out.push(`topics are listed without "(again)": ${btns().every(b => !/again/.test(b))}`);
  click(new RegExp(first.slice(0, 12).replace(/[()]/g, "."))); await sleep(60); for (let i = 0; i < 8 && !/Leave/.test(btns().join()); i++) { click(/Next/); await sleep(40); }
  out.push(`after hearing it, back on the menu: ${/Leave/.test(btns().join())}; the topic is gone: ${!btns().includes(first)}; no "(again)": ${btns().every(b => !/again/.test(b))}`);
  G.closeDlg();
  // a day when she has a standing deal: it is on the menu and opens the deal
  let guard = 0; while (guard++ < 20 && !w.Standing.today(s).some(o => o.who === "ashby")) { S.sleep(s); s.offers.length = 0; }
  const deal = w.Standing.today(s).find(o => o.who === "ashby"); G.hud(); G.talk("ashby"); await sleep(80);
  out.push(`day ${s.day}: her standing deal is on the menu${deal ? ` (${deal.sacks} sacks at ${deal.price})` : " (none found)"}: ${!!deal && btns().some(b => /^Deal:/.test(b))}; she is buying, so no "isn't buying": ${!/isn't buying/.test(txt())}`);
  if (deal) { click(/^\d?Deal:/); await sleep(80); out.push(`choosing it opens the order: ${/A standing order/.test(txt())}`); }
} catch (e) { out.push("THROWN " + e.message); } document.getElementById("out").textContent = out.join("\n"); })();
</script></body></html>
