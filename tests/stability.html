<!doctype html><html><head><meta charset="utf-8"><title>Stability</title></head><body><pre id="out">running</pre>
<!-- Quality gate: coming back to a finished season returns to the books/Court/ending (not a silent new game); the real-floor notebook entry. Run: node tests/run-html.js tests/stability.html 60000 -->
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms)), out = [];
const load = q => new Promise(r => { const f = document.createElement("iframe"); f.style.cssText = "width:1194px;height:834px;border:0"; f.src = "../game.html" + q; document.body.appendChild(f); f.onload = () => r(f); });
(async () => { try {
  let f = await load("?intro=0&savetest=1&seed=3"), w = f.contentWindow, d = w.document, errs = []; w.addEventListener("error", e => errs.push(e.message)); await sleep(500);
  const KEY = "lc_save_v4"; // core/save.js: one versioned blob {v, profile, slot, closed}
  const pid = w.Save.profile().id;
  // a season played to the end by the careful bot, saved as the game would save it
  const s = w.Spring.newGame({ story: true, seed: 3 }); while (!s.over) { w.Bot.careful.day(s); w.Spring.sleep(s); }
  const story = Object.assign(w.Story.fresh(), { ch: 9, stage: "done" });
  w.Save.saveSlot("ch1/spring", { s, story, calm: 0, usePtr: s.uses.length, fairSeen: {} }); w.Save.closeSeason("ch1/spring", s, {}); f.remove();
  f = await load("?intro=0&savetest=1"); w = f.contentWindow; d = w.document; w.addEventListener("error", e => errs.push(e.message)); await sleep(500);
  const txt = () => (d.getElementById("dlg") || {}).textContent || "", btns = () => [...d.querySelectorAll("#dlg .ch button")];
  out.push(`a finished season offers to continue, not a silent new game: ${/Welcome back/.test(txt()) && /spring is over/.test(txt()) && btns().some(b => /Continue/.test(b.textContent)) && btns().some(b => /new game/.test(b.textContent))}; the day is still ${w.G.s.day} (day 28 ended: ${w.G.s.over})`);
  btns().find(b => /Continue/.test(b.textContent)).click(); await sleep(900);
  out.push(`Continue returns to the closing books: ${!!d.getElementById("panelBody") && /Closing the books/.test(d.getElementById("panelBody").textContent)}; outcome ${w.G.s.outcome}`);
  // the new-game choice starts fresh
  f.remove(); { const b4 = JSON.parse(localStorage.getItem(KEY)); b4.slot = { season: "ch1/spring", s, story, calm: 0, usePtr: 0, fairSeen: {}, savedAt: new Date().toISOString() }; localStorage.setItem(KEY, JSON.stringify(b4)); }
  f = await load("?intro=0&savetest=1"); w = f.contentWindow; d = w.document; await sleep(500); [...d.querySelectorAll("#dlg .ch button")].find(b => /new game/.test(b.textContent)).click(); await sleep(500);
  out.push(`"Start a new game" begins day ${w.G.s.day} with a fresh story: ${w.G.s.day === 1 && w.Story.state.stage === "intro"}`);
  { const b4 = JSON.parse(localStorage.getItem(KEY)); const c = b4.closed["ch1/spring"];
    out.push(`the finished season stays in closed after a new game, and the profile survives: ${!!c && c.outcome === s.outcome && !!c.next && b4.profile.id === pid && b4.v === 4}`); }
  // the real-floor notebook entry
  w.Story.keepFloor(9, 5); const nb = w.Story.state.notebook.find(n => n.id === "opportunity"), cl = w.Story.state.clues.find(c => c.id === "opportunity");
  out.push(`the notebook splits cost from the real floor: ${!!nb && /best sale you give up/.test(nb.line) && /floor is 9, not 4/.test(nb.example)}; clue card "${cl && cl.term} | ${cl && cl.num} | ${cl && cl.from}"`);
  out.push(`JS errors: ${errs.length}${errs.length ? " " + errs[0] : ""}`);
} catch (e) { out.push("THROWN " + e.message + " " + (e.stack || "").split("\n")[1]); } document.getElementById("out").textContent = out.join("\n"); })();
</script></body></html>
